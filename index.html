<!DOCTYPE html>  
<html lang="zh-CN">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"> 

<title>慧药药盒 - 4G 云端版</title>  
<!-- 百度地图 SDK -->
<script src="https://api.map.baidu.com/api?v=3.0&ak=zSETEf8v2g5BvU3FJyMyWUcQCq1j11et"></script>  
<style>  
*{  
    box-sizing:border-box;  
    -webkit-tap-highlight-color:transparent;  
}  
:root{  
    --primary:#17324d;  
    --accent:#2f6fed;  
    --accent-light:#eaf1ff;  
    --bg:#f4f7fa;  
    --card:#ffffff;  
    --text:#17212b;  
    --text-secondary:#71808f;  
    --border:#e3e8ed;  
    --success:#22a06b;  
    --danger:#d94a4a;  
    --warning:#d99000;  
    --radius:16px;  
    --radius-sm:10px;  
    --nav-height:68px;  
    --header-height:64px;  
}  
html, body{ margin:0; padding:0; width:100%; min-height:100%; }  
body{  
    background:var(--bg); color:var(--text);  
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;  
    padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom,0px));  
}  
.header{  
    position:sticky; top:0; z-index:50; height:var(--header-height);  
    display:flex; align-items:center; justify-content:space-between; padding:0 20px;  
    background:rgba(255,255,255,.94); border-bottom:1px solid var(--border);  
    backdrop-filter:blur(18px);  
}  
.header-left{ display:flex; align-items:center; gap:10px; }  
.brand-mark{ width:30px; height:30px; border-radius:8px; background:var(--primary); position:relative; }  
.brand-mark::before{ content:""; position:absolute; width:12px; height:12px; border:2px solid white; border-radius:3px; left:7px; top:7px; }  
.app-name{ font-size:18px; font-weight:700; }  
.page{ display:none; padding:24px 20px 30px; animation:pageIn .28s ease; }  
.page.active{ display:block; }  
@keyframes pageIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }  
.page-title{ margin:0; font-size:26px; line-height:1.25; font-weight:700; }  
.page-subtitle{ margin:7px 0 24px; color:var(--text-secondary); font-size:14px; }  
.card{  
    background:var(--card); border:1px solid var(--border);  
    border-radius:var(--radius); padding:20px; margin-bottom:16px;  
    box-shadow:0 4px 16px rgba(24,45,66,.035);  
}  
.time-card{ padding:28px 20px; }  
.time-label{ text-align:center; font-size:12px; color:var(--text-secondary); letter-spacing:1px; margin-bottom:5px; }  
.big-time{ text-align:center; font-size:48px; font-weight:700; color:var(--primary); }  
.next-med{ text-align:center; margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }  
.next-med-label{ font-size:12px; color:var(--text-secondary); margin-bottom:6px; }  
.med-name{ font-size:20px; font-weight:650; }  
.med-dose{ margin-top:4px; font-size:13px; color:var(--text-secondary); }  

.status-row{ display:flex; align-items:center; justify-content:space-between; }  
.status-left{ display:flex; align-items:center; gap:10px; }  
.status-title{ font-size:14px; color:var(--text-secondary); }  
.status-value{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; }  
.status-dot{ width:9px; height:9px; border-radius:50%; background:var(--success); }  

.btn{  
    width:100%; height:52px; display:flex; align-items:center; justify-content:center; gap:9px;  
    border:0; border-radius:var(--radius-sm); background:var(--primary); color:white;  
    font-size:15px; font-weight:600; cursor:pointer; margin-top:10px; transition:.18s;  
}  
.btn:active{ transform:scale(.985); }  
.btn-accent{ background:var(--accent); }  
.btn-secondary{ background:white; color:var(--primary); border:1px solid var(--border); }  
.btn-sm{ height:44px; font-size:14px; }  

.map-container{ position:relative; width:100%; height:320px; overflow:hidden; border-radius:var(--radius); background:#e9edf1; border:1px solid var(--border); }  
.map-status{ margin-top:10px; font-size:12px; color:var(--text-secondary); text-align:center; }  
.gps-info{ padding:14px 3px; font-size:13px; color:var(--text-secondary); }  
.gps-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }  
.coord{ color:var(--text); font-family:monospace; font-size:12px; }  

.nav{ position:fixed; left:0; right:0; bottom:0; z-index:100; height:calc(var(--nav-height) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); display:flex; align-items:center; justify-around:space-around; background:rgba(255,255,255,.96); border-top:1px solid var(--border); backdrop-filter:blur(18px); }  
.nav-item{ width:25%; height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; color:#8b96a1; font-size:11px; cursor:pointer; }  
.nav-item.active{ color:var(--accent); }  
.toast-container{ position:fixed; top:78px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; align-items:center; gap:8px; width:max-content; }  
.toast{ padding:11px 20px; border-radius:9px; background:rgba(23,33,43,.92); color:white; font-size:13px; }  
</style>  
</head>  
<body>  

<header class="header">  
    <div class="header-left">  
        <div class="brand-mark"></div>  
        <span class="app-name">慧药药盒 (4G云端版)</span>  
    </div>  
</header>  

<div class="toast-container" id="toastContainer"></div>  

<!-- 首页 -->
<div id="home" class="page active">  
    <p class="page-subtitle">您好，今天也要按时用药</p>  
    <div class="card time-card">  
        <div class="time-label">CURRENT TIME</div>  
        <div class="big-time" id="currentTime">--:--</div>  
        <div class="next-med">  
            <div class="next-med-label">下一次用药</div>  
            <div class="med-name">阿司匹林</div>  
            <div class="med-dose">100mg · 每日一次</div>  
        </div>  
    </div>  

    <div class="card">  
        <div class="status-row">  
            <div class="status-left">  
                <span class="status-title">4G 模组服务</span>  
            </div>  
            <div class="status-value">  
                <span class="status-dot"></span>  
                <span>云端实时接收中</span>  
            </div>  
        </div>  
    </div>  

    <!-- 修正：跳转定位页时高亮正确的导航菜单 [1] -->
    <button class="btn btn-accent" onclick="showPage('map', document.querySelectorAll('.nav-item')[1])">  
        查看药盒实时位置  
    </button>  
</div>  

<!-- 定位页面 -->
<div id="map" class="page">  
    <h2 class="page-title">药盒定位</h2>  
    <p class="page-subtitle">从 Supabase 云端拉取 4G/GPS 位置</p>  

    <div class="map-container" id="mapContainer"></div>  
    <div class="map-status" id="mapStatus">正在连接云端获取最新位置...</div>  

    <div class="gps-info">  
        <div class="gps-row">  
            <span>最新的坐标</span>  
            <span class="coord" id="gpsText">加载中...</span>  
        </div>  
        <div class="gps-row">  
            <span>定位方式</span>  
            <span class="coord" id="typeText">--</span>  
        </div>  
        <div class="gps-row">  
            <span>更新时间</span>  
            <span class="coord" id="timeText">--</span>  
        </div>  
    </div>  

    <button class="btn btn-accent btn-sm" onclick="fetchLocationFromSupabase()">  
        手动刷新位置  
    </button>  
</div>  

<!-- 我的 -->
<div id="mine" class="page">  
    <h2 class="page-title">我的</h2>  
    <p class="page-subtitle">设备信息</p>  
    <div class="card" style="text-align:center;">  
        <p>慧药药盒 v3.0 (4G Cat.1 独立定位版)</p>  
        <p style="color:var(--text-secondary); font-size:12px;">设备无需连接手机蓝牙即可自动传输坐标</p>  
    </div>  
</div>  

<!-- 底部导航 -->
<nav class="nav">  
    <div class="nav-item active" onclick="showPage('home',this)">首页</div>  
    <div class="nav-item" onclick="showPage('map',this)">定位</div>  
    <div class="nav-item" onclick="showPage('mine',this)">我的</div>  
</nav>  

<script>  
// Supabase 配置（按最新表名解析）
const SUPABASE_URL = "https://ysczioloqsdphrrmueau.supabase.co/rest/v1/gps_location?select=*&order=id.desc&limit=1";

const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzY3ppb2xvcXNkcGhycm11ZWF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjQxNDQsImV4cCI6MjEwMjM0MDE0NH0.RVp3Dm_naEZm_rROPEMbeTuaeq0BaS6nTZh-y3yBISQ";

let baiduMap = null;  
let boxMarker = null;  

function showToast(message){  
    const container = document.getElementById("toastContainer");  
    const toast = document.createElement("div");  
    toast.className = "toast";  
    toast.textContent = message;  
    container.appendChild(toast);  
    setTimeout(()=>{ toast.remove(); }, 2000);  
}  

/* 页面切换 */  
function showPage(id, navElement){  
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));  
    document.getElementById(id).classList.add("active");  

    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));  
    if(navElement) navElement.classList.add("active");  

    if(id === "map"){  
        setTimeout(()=>{  
            initBaiduMap();  
            fetchLocationFromSupabase();  
        }, 150);  
    }  
}  

/* 顶栏时钟 */  
function updateClock(){  
    const now = new Date();  
    const hours = String(now.getHours()).padStart(2, "0");  
    const minutes = String(now.getMinutes()).padStart(2, "0");  
    document.getElementById("currentTime").textContent = hours + ":" + minutes;  
}  
setInterval(updateClock, 1000);  

/* 初始化地图 */  
function initBaiduMap(){  
    if(baiduMap) return;  
    baiduMap = new BMap.Map("mapContainer");  
    const defaultPoint = new BMap.Point(116.404, 39.915);  
    baiduMap.centerAndZoom(defaultPoint, 15);  
    baiduMap.enableScrollWheelZoom(true);  
}  

/* 从 Supabase 数据库拉取数据 */  
async function fetchLocationFromSupabase() {  
    document.getElementById("mapStatus").textContent = "拉取云端数据中...";  
    try {  
        const response = await fetch(SUPABASE_URL, {  
            headers: {  
                "apikey": API_KEY,  
                "Authorization": "Bearer " + API_KEY  
            }  
        });  
        const data = await response.json();  

        if (Array.isArray(data) && data.length > 0) {  
            const record = data[0];  
            const lat = Number(record.latitude);  
            const lng = Number(record.longitude);  
            const type = record.type || "GPS";  
            const time = new Date(record.created_at || Date.now()).toLocaleTimeString();  

            // 格式化文本显示 (增加防空保护)
            document.getElementById("gpsText").textContent = lat.toFixed(6) + ", " + lng.toFixed(6);  
            document.getElementById("typeText").textContent = type.toUpperCase();  
            document.getElementById("timeText").textContent = time;  

            // 转换坐标并渲染地图  
            convertAndShowOnMap(lng, lat);  
            document.getElementById("mapStatus").textContent = "位置已更新";  
            showToast("成功获取最新位置");  
        } else {  
            document.getElementById("mapStatus").textContent = "云端暂无数据，请等待药盒上传";  
        }  
    } catch (err) {  
        console.error("请求失败详情:", err);  
        document.getElementById("mapStatus").textContent = "获取云端数据失败，请检查网络或Key配置";  
    }  
}  

/* 坐标转换并标注地图 */  
function convertAndShowOnMap(longitude, latitude) {  
    if (!baiduMap) initBaiduMap();  
    const gpsPoint = new BMap.Point(longitude, latitude);  
    const convertor = new BMap.Convertor();  

    convertor.translate([gpsPoint], 1, 5, function(data) {  
        let point = gpsPoint;  
        if (data.status === 0 && data.points && data.points.length > 0) {  
            point = data.points[0];  
        }  
        
        if(!boxMarker){  
            boxMarker = new BMap.Marker(point);  
            baiduMap.addOverlay(boxMarker);  
            boxMarker.setLabel(new BMap.Label("药盒位置", { offset: new BMap.Size(20, -10) }));  
        } else {  
            boxMarker.setPosition(point);  
        }  
        baiduMap.centerAndZoom(point, 17);  
    });  
}  

document.addEventListener("DOMContentLoaded", function(){  
    updateClock();  
});  
</script>  
</body>  
</html>
